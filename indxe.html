<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>开发者选项跳转工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f7fa;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 36px 28px 32px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
        }
        .card h1 {
            font-size: 22px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 6px;
        }
        .card .sub {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 28px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 16px 12px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 500;
            color: #ffffff;
            background: #3b82f6;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            text-align: center;
            text-decoration: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn-primary { background: #3b82f6; }
        .btn-primary:hover { background: #2563eb; }

        .btn-success { background: #22c55e; }
        .btn-success:hover { background: #16a34a; }

        .btn-warning { background: #f59e0b; }
        .btn-warning:hover { background: #d97706; }

        .btn-secondary { background: #8b8fa7; }
        .btn-secondary:hover { background: #6b6f87; }

        .btn .badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 400;
            background: rgba(255,255,255,0.25);
            padding: 0 10px;
            border-radius: 20px;
            margin-left: 8px;
        }
        .footer-note {
            margin-top: 22px;
            font-size: 13px;
            color: #94a3b8;
            background: #f8fafc;
            padding: 12px 16px;
            border-radius: 12px;
            border-left: 4px solid #e2e8f0;
            text-align: left;
        }
        .footer-note code {
            font-size: 12px;
            background: #eef2f6;
            padding: 0 6px;
            border-radius: 4px;
            color: #1e293b;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>🔧 开发者选项跳转</h1>
    <p class="sub">点击下方按钮尝试直接打开开发者设置</p>

    <div class="btn-group">
        <!-- 按钮1：经典入口 -->
        <button class="btn btn-primary" onclick="jumpTo('classic')">
            📌 直接调用开发者选项 Activity
        </button>

        <!-- 按钮2：新版Dashboard -->
        <button class="btn btn-success" onclick="jumpTo('dashboard')">
            🆕 新版开发者选项 Dashboard
        </button>

        <!-- 按钮3：旧版（备用） -->
        <button class="btn btn-warning" onclick="jumpTo('legacy')">
            ⏳ 旧版开发者设置
        </button>
    </div>

    <div class="footer-note">
        💡 若点击后无反应或闪退，说明该入口已被系统屏蔽。<br/>
        三个都无效时，请尝试电脑 ADB 连接方式。
    </div>
</div>

<script>
    /**
     * 三个跳转目标
     */
    const INTENTS = {
        // 1. 经典开发者选项 Activity (最常见)
        classic: 'intent:#Intent;component=com.android.settings/.Settings$DevelopmentSettingsActivity;end',

        // 2. 新版开发者选项 Dashboard (Android 9+ 引入)
        dashboard: 'intent:#Intent;component=com.android.settings/.Settings$DevelopmentSettingsDashboardActivity;end',

        // 3. 旧版开发者设置 (备选，部分机型可用)
        legacy: 'intent:#Intent;component=com.android.settings/.Settings$DevelopmentSettingsActivity;end'
    };

    /**
     * 执行跳转
     * @param {string} key - 'classic' | 'dashboard' | 'legacy'
     */
    function jumpTo(key) {
        const uri = INTENTS[key];
        if (!uri) {
            alert('无效的跳转目标');
            return;
        }

        try {
            // 方法1：通过 location.href 跳转（最常用）
            window.location.href = uri;

            // 方法2（备选）：如果上面无效，尝试通过创建 iframe 触发
            // 部分浏览器对 location.href 拦截时，iframe 方式可能有效
            // 但为了简洁，这里优先使用 location.href

            // 设置一个 2 秒的“保底”提示（如果跳转成功，页面会离开，这个提示不会出现）
            setTimeout(() => {
                // 如果 2 秒后页面还在，说明跳转可能未成功
                // 但不弹框干扰用户，静默即可
            }, 2000);

        } catch (e) {
            console.error('跳转异常:', e);
            alert('跳转失败，请尝试其他方式。\n' + e.message);
        }
    }

    // 可选：在控制台暴露，方便调试
    console.log('开发者选项跳转工具已加载');
    console.log('可用的跳转目标:', Object.keys(INTENTS));
</script>

</body>
</html>
