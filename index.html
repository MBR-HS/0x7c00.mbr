<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>开发者选项跳转工具 - 完整版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f7fa;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 28px 24px 32px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
        }
        .card h1 {
            font-size: 20px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 4px;
        }
        .card .sub {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 24px;
        }
        .divider {
            border: none;
            border-top: 1px solid #e9edf2;
            margin: 18px 0;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px 12px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            color: #ffffff;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            text-align: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn-blue { background: #3b82f6; }
        .btn-blue:hover { background: #2563eb; }

        .btn-green { background: #22c55e; }
        .btn-green:hover { background: #16a34a; }

        .btn-amber { background: #f59e0b; }
        .btn-amber:hover { background: #d97706; }

        .btn-purple { background: #8b5cf6; }
        .btn-purple:hover { background: #7c3aed; }

        .btn-pink { background: #ec4899; }
        .btn-pink:hover { background: #db2777; }

        .btn-gray { background: #8b8fa7; }
        .btn-gray:hover { background: #6b6f87; }

        .badge {
            display: inline-block;
            font-size: 10px;
            font-weight: 400;
            background: rgba(255,255,255,0.25);
            padding: 0 10px;
            border-radius: 20px;
            margin-left: 6px;
        }
        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: #64748b;
            text-align: left;
            margin: 6px 0 8px;
        }
        .footer-note {
            margin-top: 20px;
            font-size: 13px;
            color: #94a3b8;
            background: #f8fafc;
            padding: 12px 16px;
            border-radius: 12px;
            border-left: 4px solid #e2e8f0;
            text-align: left;
        }
        .footer-note code {
            font-size: 11px;
            background: #eef2f6;
            padding: 0 6px;
            border-radius: 4px;
            color: #1e293b;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>🔧 开发者选项跳转</h1>
    <p class="sub">完整版 · 共 6 种尝试方式</p>

    <!-- 第一组：早期入口 -->
    <div class="section-title">📌 早期入口（Activity）</div>
    <div class="btn-group">
        <button class="btn btn-blue" onclick="jumpTo('classic')">直接调用开发者选项 Activity</button>
        <button class="btn btn-green" onclick="jumpTo('dashboard')">新版开发者选项 Dashboard</button>
        <button class="btn btn-amber" onclick="jumpTo('legacy')">旧版开发者设置</button>
    </div>

    <hr class="divider" />

    <!-- 第二组：新发现的底层入口 -->
    <div class="section-title">🧩 底层入口（Intent Action / Fragment）</div>
    <div class="btn-group">
        <button class="btn btn-purple" onclick="jumpTo('standard_action')">系统标准动作 (APPLICATION_DEVELOPMENT_SETTINGS)</button>
        <button class="btn btn-pink" onclick="jumpTo('fragment_subsettings')">SubSettings 加载开发者选项 Fragment</button>
        <button class="btn btn-pink" onclick="jumpTo('fragment_settingsactivity')">SettingsActivity 加载开发者选项 Fragment</button>
    </div>

    <div class="footer-note">
        💡 点击后若跳转到开发者选项界面，即为成功。<br/>
        若<strong>无反应或闪退</strong>，说明该入口已被系统屏蔽。<br/>
        六个都无效时，请放弃此路径。
    </div>
</div>

<script>
    /**
     * 六个跳转目标
     */
    const INTENTS = {
        // 第一组：早期 Activity 入口
        classic: 'intent:#Intent;component=com.android.settings/.Settings$DevelopmentSettingsActivity;end',
        dashboard: 'intent:#Intent;component=com.android.settings/.Settings$DevelopmentSettingsDashboardActivity;end',
        legacy: 'intent:#Intent;component=com.android.settings/.Settings$DevelopmentSettingsActivity;end',

        // 第二组：新发现的底层入口
        standard_action: 'intent:#Intent;action=android.settings.APPLICATION_DEVELOPMENT_SETTINGS;end',
        fragment_subsettings: 'intent:#Intent;action=android.intent.action.MAIN;launchFlags=0x10810000;component=com.android.settings/.SubSettings;S.%3Asettings%3Ashow_fragment=com.android.settings.development.DevelopmentSettingsDashboardFragment;end',
        fragment_settingsactivity: 'intent:#Intent;action=android.intent.action.MAIN;launchFlags=0x10810000;component=com.android.settings/.SettingsActivity;S.%3Asettings%3Ashow_fragment=com.android.settings.development.DevelopmentSettingsDashboardFragment;end'
    };

    /**
     * 执行跳转
     * @param {string} key - 跳转目标的键名
     */
    function jumpTo(key) {
        const uri = INTENTS[key];
        if (!uri) {
            alert('无效的跳转目标');
            return;
        }

        try {
            // 通过 location.href 触发 Intent
            window.location.href = uri;
        } catch (e) {
            console.error('跳转异常:', e);
            alert('跳转失败，请尝试其他方式。\n' + e.message);
        }
    }

    // 在控制台输出帮助信息
    console.log('🔧 开发者选项跳转工具已加载');
    console.log('可用的跳转目标:', Object.keys(INTENTS));
    console.log('点击按钮即可尝试跳转。');
</script>

</body>
</html>
